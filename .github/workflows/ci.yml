name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            go.sum
            examples/go.sum
            wasm.work.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Task
        uses: go-task/setup-task@v2
      - name: Check, test, and build
        run: task ci
