version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "test" task'
    deps:
      - test

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

  go-tidy:
    desc: 'Go tidy all the things'
    cmds:
      - go mod tidy

  test:
    desc: 'Run the tests'
    cmds:
      - go test -mod=readonly ./...

  test-race:
    desc: 'Run the tests with the race detector'
    cmds:
      - go test -mod=readonly -race ./...

  vet:
    desc: 'Run go vet'
    cmds:
      - go vet -mod=readonly ./...

  fmt-check:
    desc: 'Fail if any file is not gofmt-formatted'
    cmds:
      - test -z "$(gofmt -l .)"

  go-tidy-check:
    desc: 'Fail if go.mod or go.sum need tidying'
    cmds:
      - go mod tidy -diff

  cross:
    desc: 'Vet and build for every supported platform without CGO'
    env:
      CGO_ENABLED: '0'
    cmds:
      - GOOS=windows go vet -mod=readonly ./...
      - GOOS=linux go vet -mod=readonly ./...
      - GOOS=darwin go vet -mod=readonly ./...
      - GOOS=freebsd go build -mod=readonly ./...
      - GOOS=js GOARCH=wasm go build -mod=readonly ./...

  staticcheck:
    desc: 'Run staticcheck'
    cmds:
      - go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  ci:
    desc: 'Check formatting, dependencies, tests, vet, platforms, and staticcheck'
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: test-race
      - task: vet
      - task: cross
      - task: staticcheck
