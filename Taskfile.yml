version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "test" and "build" tasks'
    deps:
      - test
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

  build:
    desc: 'Build the examples into bin/'
    cmds:
      - go -C examples build -mod=readonly -o ../bin/ntopen ./ntopen
      - go -C examples build -mod=readonly -o ../bin/choose ./choose
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - examples/go.mod
      - examples/go.sum
    generates:
      - bin/ntopen
      - bin/choose

  choose:
    desc: 'Run the choose example (-- -pretend for a made-up home folder)'
    interactive: true
    cmds: ['go -C examples run ./choose {{.CLI_ARGS}}']

  clean:
    desc: 'Remove built programs and generated site files'
    deps:
      - clean-wasm-site
    cmds:
      - rm -rf bin .task

  go-tidy:
    desc: 'Go tidy all the things'
    cmds:
      - go mod tidy
      - go -C examples mod tidy

  test:
    desc: 'Run the tests'
    cmds:
      - go test -mod=readonly ./...
      - go -C examples test -mod=readonly ./...

  test-race:
    desc: 'Run the tests with the race detector'
    cmds:
      - go test -mod=readonly -race ./...
      - go -C examples test -mod=readonly -race ./...

  vet:
    desc: 'Run go vet'
    cmds:
      - go vet -mod=readonly ./...
      - go -C examples vet -mod=readonly ./...

  fmt-check:
    desc: 'Fail if any file is not gofmt-formatted'
    cmds:
      - test -z "$(gofmt -l .)"

  go-tidy-check:
    desc: 'Fail if go.mod or go.sum need tidying'
    cmds:
      - go mod tidy -diff
      - go -C examples mod tidy -diff

  cross:
    desc: 'Vet and build for every supported platform without CGO'
    env:
      CGO_ENABLED: '0'
    cmds:
      - GOOS=windows go vet -mod=readonly ./...
      - GOOS=linux go vet -mod=readonly ./...
      - GOOS=darwin go vet -mod=readonly ./...
      - GOOS=freebsd go build -mod=readonly ./...
      - GOOS=js GOARCH=wasm go vet -mod=readonly ./...
      # The examples, natively; their js/wasm build is build-wasm's.
      - GOOS=windows go -C examples vet -mod=readonly ./...
      - GOOS=linux go -C examples vet -mod=readonly ./...
      - GOOS=darwin go -C examples vet -mod=readonly ./...
      - GOOS=freebsd go -C examples build -mod=readonly ./...

  staticcheck:
    desc: 'Run staticcheck'
    cmds:
      - go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - go -C examples run honnef.co/go/tools/cmd/staticcheck@latest ./...

###############################################################################
# Demo website via booba

  build-wasm:
    desc: 'Build the browser demo into web/demos/'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - go -C examples build -mod=readonly -o ../web/demos/choose.wasm ./choose

  build-wasm-site:
    desc: 'Build the WASM demo site into web/ and export the pinned booba runtime'
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web/
      - cp LICENSE.txt web/LICENSE
      - cp THIRD_PARTY_NOTICES.md web/

  check-site:
    desc: 'Check site script syntax, required assets, and the demo under Node'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - node scripts/smoke-demo.mjs

  ci-site:
    desc: 'Build the WASM demo site and check it (CI runs it on Ubuntu only)'
    cmds:
      - task: build-wasm-site
      - task: check-site

  serve-wasm-site:
    desc: 'Serve web/ at http://localhost:8000/ntopenwith/ (matches GH Pages prefix)'
    deps:
      - build-wasm-site
    vars:
      SERVE_DIR: /tmp/ntopenwith-site
    cmds:
      - mkdir -p "{{.SERVE_DIR}}"
      - ln -sfn "$PWD/web" "{{.SERVE_DIR}}/ntopenwith"
      - python3 -m http.server 8000 --directory "{{.SERVE_DIR}}"

  clean-wasm-site:
    desc: 'Remove generated WASM demo site artifacts'
    cmds:
      - rm -rf web/booba web/ghostty-web web/demos
      - rm -f web/wasm_exec.js web/LICENSE web/THIRD_PARTY_NOTICES.md

###############################################################################
# Dependency notices and the gate

  notices:
    desc: 'Regenerate the dependency notices'
    cmds:
      - go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md

  notices-check:
    desc: 'Verify that the dependency notices are current'
    cmds:
      - go run ./internal/tools/notices | cmp -s - THIRD_PARTY_NOTICES.md

  ci:
    desc: 'Check formatting, dependencies, tests, vet, platforms, the examples, notices, and staticcheck'
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: test-race
      - task: vet
      - task: cross
      - task: build
      - task: notices-check
      - task: staticcheck
